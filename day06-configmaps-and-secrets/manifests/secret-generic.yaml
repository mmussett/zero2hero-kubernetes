# NOTE: values below are base64-ENCODED, not encrypted. Anyone who can read
# this Secret via the API can trivially decode it. Base64 is an encoding
# for safely storing arbitrary bytes in a text field, not a security control.
# `echo -n 'admin' | base64`      -> YWRtaW4=
# `echo -n 's3cr3t-pass' | base64` -> czNjcjN0LXBhc3M=
apiVersion: v1
kind: Secret
metadata:
  name: hello-db-secret
type: Opaque
data:
  DB_USER: YWRtaW4=
  DB_PASSWORD: czNjcjN0LXBhc3M=
