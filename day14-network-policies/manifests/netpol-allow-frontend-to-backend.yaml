# Punches a hole through default-deny-ingress: Pods labeled role=backend
# accept ingress ONLY from Pods labeled role=frontend, on port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels: {role: backend}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: frontend}
      ports:
        - protocol: TCP
          port: 8080
