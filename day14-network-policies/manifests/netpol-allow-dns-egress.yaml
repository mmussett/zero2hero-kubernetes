# A default-deny on EGRESS (unlike ingress) also blocks outbound DNS
# lookups to CoreDNS, breaking almost everything. This policy is the
# standard companion to any egress-restricting policy: always explicitly
# allow DNS first, or nothing else will resolve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
