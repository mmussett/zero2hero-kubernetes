apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app: backend, role: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata:
      labels: {app: backend, role: backend}
    spec:
      containers:
        - name: hello-k8s
          image: localhost:5000/hello-k8s:1.0.0
          env: [{name: GREETING, value: "Reached the BACKEND"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels: {app: backend}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 8080}]
