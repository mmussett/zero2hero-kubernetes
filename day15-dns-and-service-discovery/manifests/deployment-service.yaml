apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s
  labels: {app: hello-k8s}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello-k8s}}
  template:
    metadata: {labels: {app: hello-k8s}}
    spec:
      containers:
        - name: hello-k8s
          image: localhost:5000/hello-k8s:1.0.0
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: hello-k8s-svc}
spec:
  selector: {app: hello-k8s}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata: {name: netshoot}
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "3600"]
