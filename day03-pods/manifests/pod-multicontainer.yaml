# Sidecar pattern: an nginx web server serving files that a "log shipper"
# sidecar tails, sharing an emptyDir volume between the two containers.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
      ports:
        - containerPort: 80
    - name: log-shipper
      image: busybox:1.36
      command: ["/bin/sh", "-c", "tail -F /var/log/nginx/access.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
