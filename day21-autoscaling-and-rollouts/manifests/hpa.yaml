apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # scale out once average CPU exceeds 50% of the REQUEST (200m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # wait 60s of sustained low usage before scaling back down
