# The smallest valid HorizontalPodAutoscaler — no scale-down tuning, no
# multiple metrics. `scaleTargetRef` names an EXISTING Deployment (from
# hpa-app.yaml) that must already have resources.requests.cpu set, or
# this has nothing to compute a percentage against (Day 21 §1.1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-world-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
