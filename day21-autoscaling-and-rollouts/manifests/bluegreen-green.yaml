apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-green
  labels: {app: hello-bg, track: green}
spec:
  replicas: 3
  selector: {matchLabels: {app: hello-bg, track: green}}
  template:
    metadata: {labels: {app: hello-bg, track: green}}
    spec:
      containers:
        - name: hello-k8s
          image: localhost:5000/hello-k8s:1.0.0
          env: [{name: GREETING, value: "I am GREEN (new version)"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
