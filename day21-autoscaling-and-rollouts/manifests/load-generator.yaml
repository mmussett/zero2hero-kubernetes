# Hammers php-apache with continuous requests to drive its CPU usage up,
# giving the HPA a real signal to scale on.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do wget -q -O- http://php-apache >/dev/null; done"
