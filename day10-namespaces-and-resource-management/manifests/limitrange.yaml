apiVersion: v1
kind: LimitRange
metadata:
  name: team-alpha-limits
  namespace: team-alpha
spec:
  limits:
    - type: Container
      default:                 # applied if a container specifies no limits
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:          # applied if a container specifies no requests
        cpu: "100m"
        memory: "128Mi"
      max:                     # hard ceiling any container's limit may set
        cpu: "500m"
        memory: "512Mi"
      min:                     # hard floor any container's request may set
        cpu: "50m"
        memory: "64Mi"
