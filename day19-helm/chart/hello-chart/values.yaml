# Default values for hello-chart. Override any of these at install/upgrade
# time with --set key=value or -f my-values.yaml.
replicaCount: 2

image:
  repository: localhost:5000/hello-k8s
  tag: "1.0.0"
  pullPolicy: IfNotPresent

greeting: "Hello from a Helm chart!"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false
  host: hello-chart.local

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
