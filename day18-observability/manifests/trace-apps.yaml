apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-backend
  namespace: monitoring
  labels: {app: trace-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: trace-backend}}
  template:
    metadata: {labels: {app: trace-backend}}
    spec:
      containers:
        - name: trace-backend
          image: localhost:5000/trace-backend:1.0.0
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4318"}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources:
            requests: {cpu: "50m", memory: "96Mi"}
            limits: {cpu: "200m", memory: "192Mi"}
---
apiVersion: v1
kind: Service
metadata: {name: trace-backend, namespace: monitoring}
spec:
  selector: {app: trace-backend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-frontend
  namespace: monitoring
  labels: {app: trace-frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: trace-frontend}}
  template:
    metadata: {labels: {app: trace-frontend}}
    spec:
      containers:
        - name: trace-frontend
          image: localhost:5000/trace-frontend:1.0.0
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4318"}
            - {name: BACKEND_URL, value: "http://trace-backend"}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources:
            requests: {cpu: "50m", memory: "96Mi"}
            limits: {cpu: "200m", memory: "192Mi"}
---
apiVersion: v1
kind: Service
metadata: {name: trace-frontend, namespace: monitoring}
spec:
  selector: {app: trace-frontend}
  ports: [{port: 80, targetPort: 8080}]
