apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

configMapGenerator:
  - name: hello-config
    behavior: merge          # MERGE into the base's generated ConfigMap, don't replace it
    literals:
      - GREETING=Hello from DEV!

replicas:
  - name: hello-k8s
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "10m"
    target:
      kind: Deployment
      name: hello-k8s
