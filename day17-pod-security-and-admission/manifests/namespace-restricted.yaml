# Pod Security Standards are enforced per-namespace via LABELS on the
# Namespace itself — no separate policy object needed (unlike the older,
# now-removed PodSecurityPolicy). The built-in "PodSecurity" admission
# controller reads these labels automatically.
apiVersion: v1
kind: Namespace
metadata:
  name: restricted-ns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
