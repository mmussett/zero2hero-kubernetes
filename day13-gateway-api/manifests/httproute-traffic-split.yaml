# NATIVE, precise weighted traffic splitting -- no controller-specific
# annotation, no replica-count approximation (contrast directly with
# Day 20's canary-canary.yaml/canary-stable.yaml, which approximated a
# 90/10 split via a 9:1 REPLICA ratio because Ingress has no native
# weighting concept at all). Gateway API's backendRefs[].weight is exact
# and independent of how many replicas either backend actually runs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-traffic-split
spec:
  parentRefs:
    - {name: envoy-gw}
  hostnames: ["gw-split.zero2hero.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: hello-v1-svc, port: 80, weight: 80}
        - {name: hello-v2-svc, port: 80, weight: 20}
