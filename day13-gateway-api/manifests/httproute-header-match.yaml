# Header-based routing, natively, as a first-class match type -- plain
# Ingress has NO equivalent field at all; achieving this pre-Gateway-API
# required a controller-specific annotation (or wasn't possible without
# a full service mesh). Requests carrying "X-VIP: true" go to
# vip-backend; everything else falls through to hello-v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-header-match
spec:
  parentRefs:
    - {name: envoy-gw}
  hostnames: ["gw-headers.zero2hero.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
          headers:
            - {name: X-VIP, value: "true"}
      backendRefs:
        - {name: vip-backend-svc, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: hello-v1-svc, port: 80}
