# THE central lesson of this day, made visible in one file: three
# HTTPRoutes, one per Gateway implementation, with a BYTE-IDENTICAL
# `rules` block. Compare this directly to Day 12's ingress-nginx.yaml /
# ingress-kong.yaml, which each needed implementation-specific
# annotations to do the same job. Nothing here is NGINX-specific,
# Kong-specific, or Envoy-specific -- it's pure Gateway API core spec.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route-envoy
spec:
  parentRefs:
    - {name: envoy-gw}
  hostnames: ["gw-envoy.zero2hero.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: hello-v1-svc, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route-nginx
spec:
  parentRefs:
    - {name: nginx-gw}
  hostnames: ["gw-nginx.zero2hero.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: hello-v1-svc, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route-kong
spec:
  parentRefs:
    - {name: kong-gw}
  hostnames: ["gw-kong.zero2hero.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: hello-v1-svc, port: 80}
