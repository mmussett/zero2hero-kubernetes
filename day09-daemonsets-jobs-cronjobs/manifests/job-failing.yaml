# Always fails, to demonstrate backoffLimit and the Job's final Failed state
# (as opposed to a bare Pod's infinite CrashLoopBackOff).
apiVersion: batch/v1
kind: Job
metadata:
  name: doomed-job
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.36
          command: ["sh", "-c", "echo This always fails; exit 1"]
