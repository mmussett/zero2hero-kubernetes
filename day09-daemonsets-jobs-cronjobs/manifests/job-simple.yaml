apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  completions: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never    # Jobs must use Never or OnFailure, not Always
      containers:
        - name: work
          image: busybox:1.36
          command: ["sh", "-c", "echo Starting work...; sleep 5; echo Work complete."]
